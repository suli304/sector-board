<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板块信号看板 v2.0 — 整合版（C10）</title>
<!-- ECharts 5.x 本地打包引入（方案 4.6） -->
<script src="vendor/echarts.min.js"></script>
<script src="linkage.js"></script>
<style>
:root {
  --bg: #0f1420;
  --panel: #1a2233;
  --border: #2c3a55;
  --text: #e8eef7;
  --text-dim: #8fa3c0;
  --accent: #3d9fff;
  --up: #ef4444;   /* 中国习惯：红涨 */
  --down: #22c55e; /* 绿跌 */
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; }
header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
header h1 { font-size: 17px; font-weight: 600; }
header .meta { font-size: 12px; color: var(--text-dim); }
nav#tabNav { display: flex; gap: 4px; padding: 8px 20px 0; border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; }
nav#tabNav button { background: transparent; color: var(--text-dim); border: 1px solid transparent; border-bottom: none; padding: 9px 18px; font-size: 14px; cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; }
nav#tabNav button:hover { color: var(--text); background: rgba(61,159,255,.08); }
nav#tabNav button.active { color: var(--accent); border-color: var(--border); background: var(--panel); font-weight: 600; }
main { flex: 1; padding: 14px 20px 26px; overflow: hidden; display: flex; flex-direction: column; }
.tab-panel { display: none; flex: 1; min-height: 0; }
.tab-panel.active { display: flex; flex-direction: column; }
.tab-panel iframe { flex: 1; width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
#statusBar { padding: 5px 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); display: flex; gap: 16px; flex-shrink: 0; }
#statusBar .ok { color: var(--down); }
#statusBar .warn { color: #f59e0b; }
</style>
</head>
<body>

<header>
  <h1>📊 板块信号看板 v2.0</h1>
  <div style="display:flex;align-items:center;gap:16px;">
    <button id="backtestBtn" style="background:transparent;border:1px solid var(--accent);color:var(--accent);padding:5px 14px;border-radius:6px;font-size:13px;cursor:pointer;">🧪 回测</button>
    <div class="meta">L3 看板层 · 整合版（C10）· 6 Tab 联动 · 分片加载 · 数据源：B8 判定表 + E1-E6</div>
  </div>
</header>

<nav id="tabNav" role="tablist">
  <button data-tab="tab-main" class="active" role="tab">① 主图</button>
  <button data-tab="tab-divergence" role="tab">② 背离</button>
  <button data-tab="tab-rotation" role="tab">③ 板块轮动</button>
  <button data-tab="tab-intraday" role="tab">④ 日内形态</button>
  <button data-tab="tab-composite" role="tab">⑤ 综合异常打分</button>
  <button data-tab="tab-data" role="tab">⑥ 数据看板</button>
</nav>

<main>
  <!-- ① 主图：高优先级立即加载（首屏 <2s，方案 13.4） -->
  <section id="tab-main" class="tab-panel active" data-priority="high">
    <iframe id="frame-main" src="tab1_main.html" title="主图" allowfullscreen></iframe>
  </section>

  <!-- ②-⑥ 排行视图：懒加载（分片，方案 13.4） -->
  <section id="tab-divergence" class="tab-panel" data-priority="low">
    <iframe id="frame-divergence" src="tab2_divergence.html" loading="lazy" title="背离"></iframe>
  </section>
  <section id="tab-rotation" class="tab-panel" data-priority="low">
    <iframe id="frame-rotation" src="tab3_rotation.html" loading="lazy" title="板块轮动"></iframe>
  </section>
  <section id="tab-intraday" class="tab-panel" data-priority="low">
    <iframe id="frame-intraday" src="tab4_intraday.html" loading="lazy" title="日内形态"></iframe>
  </section>
  <section id="tab-composite" class="tab-panel" data-priority="low">
    <iframe id="frame-composite" src="tab5_composite.html" loading="lazy" title="综合异常打分"></iframe>
  </section>
  <section id="tab-data" class="tab-panel" data-priority="low">
    <iframe id="frame-data" src="tab6_databoard.html" loading="lazy" title="数据看板"></iframe>
  </section>
</main>

<div id="statusBar">
  <span>ECharts: <span id="st-echarts" class="warn">检测中…</span></span>
  <span>联动: <span id="st-link" class="warn">就绪</span></span>
  <span id="st-log"></span>
</div>

<!-- B09/G-039: 回测入口占位弹层 -->
<div id="btModal" style="display:none;position:fixed;inset:0;background:rgba(8,12,20,.72);z-index:999;align-items:center;justify-content:center;">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px 26px;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.5);">
    <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px;">🧪 回测功能（G-039）</div>
    <div style="font-size:13px;color:var(--text-dim);line-height:1.8;">
      回测入口当前为占位，独立回测页面将在后续迭代接入。<br>
      现有回测成果见项目 <b>backtest/</b> 目录：G4 日内形态回测报告、CAL2 背离校准报告、E2 指标有效性报告、E3 权重表等。
    </div>
    <div style="margin-top:16px;text-align:right;">
      <button id="btClose" style="background:var(--accent);border:none;color:#fff;padding:6px 18px;border-radius:6px;font-size:13px;cursor:pointer;">关闭</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  function setStatus(id, text) {
    var el = document.getElementById('st-' + id);
    if (el) el.textContent = text;
  }
  function log(msg) {
    var el = document.getElementById('st-log');
    if (el) el.textContent = msg;
  }

  var hasECharts = !!(window.echarts && typeof window.echarts.init === 'function');
  setStatus('echarts', hasECharts ? '✔ 5.x 已加载' : '✘ 未加载');

  /* ============ Tab 切换 ============ */
  var nav = document.getElementById('tabNav');
  var buttons = nav.querySelectorAll('button[data-tab]');
  var panels = document.querySelectorAll('.tab-panel');
  function switchTab(target) {
    buttons.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === target); });
    panels.forEach(function (p) { p.classList.toggle('active', p.id === target); });
    log('切换到: ' + target);
  }
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      switchTab(btn.getAttribute('data-tab'));
    });
  });

  /* ============ C9/C10 联动：跨 Tab 导航消息 → 切面板 + 转发主图 iframe ============
   * 链路：Tab2/4/5/6 iframe 内点击 → emitNav postMessage 给父窗口（本页）
   *       → 本页 onNav：① 切换面板 ② 转发 board-nav 给主图 iframe（tab1 切标的）
   */
  var FRAME_MAP = {
    'tab-main': 'frame-main',
    'tab-divergence': 'frame-divergence',
    'tab-rotation': 'frame-rotation',
    'tab-intraday': 'frame-intraday',
    'tab-composite': 'frame-composite',
    'tab-data': 'frame-data'
  };
  if (window.BoardLink) {
    window.BoardLink.onNav(function (nav) {
      if (!nav) return;
      if (nav.tab) {
        switchTab(nav.tab);
        log('联动跳转: ' + (nav.code || '') + ' → ' + nav.tab);
      }
      /* 转发给主图 iframe：排行/表格点击 → 主图切对应板块/个股（方案 12.4） */
      var f = document.getElementById(FRAME_MAP['tab-main']);
      if (f && f.contentWindow && nav.code) {
        try { f.contentWindow.postMessage({ type: 'board-nav', code: nav.code, level: nav.level || 'sector' }, '*'); } catch (e) { }
      }
    });
  }

  /* ============ 状态展示（board-state 订阅，不重渲染防回环） ============ */
  if (window.BoardLink) {
    window.BoardLink.onState(function (st) {
      if (st && st.code) {
        setStatus('link', '标的 ' + st.code + ' · ' + (st.period || 'daily') + ' · ' + (st.caliber || 'main'));
      }
    });
  }

  window.Board = { DataLoader: window.BoardLink, echarts: window.echarts, setStatus: setStatus, log: log };

  /* B09/G-039: 回测入口占位弹层 */
  var btBtn = document.getElementById('backtestBtn');
  var btModal = document.getElementById('btModal');
  if (btBtn && btModal) {
    btBtn.addEventListener('click', function () { btModal.style.display = 'flex'; });
    btModal.addEventListener('click', function (e) {
      if (e.target === btModal || e.target.id === 'btClose') btModal.style.display = 'none';
    });
  }

  log('整合版就绪 · 6 Tab 联动已接通');
})();
</script>
</body>
</html>
